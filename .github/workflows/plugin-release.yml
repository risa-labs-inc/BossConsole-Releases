name: Plugin Release

on:
  workflow_call:
    inputs:
      boss_plugin_api_version:
        description: 'Version of boss-plugin-api: "latest" (default) auto-fetches newest release, specific version like "1.0.36", or "none" to skip.'
        required: false
        type: string
        default: 'latest'
      version_increment:
        description: 'Version increment type: patch, minor, major, or none to skip bumping.'
        required: false
        type: string
        default: 'patch'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY:
        required: true
      SUPABASE_ANON_KEY:
        required: false
      # The version bump pushes straight to main. GITHUB_TOKEN runs as the
      # github-actions app, which is a built-in rather than an org installation,
      # so it cannot be named as a bypass actor on a ruleset and its push is
      # refused once main requires a pull request. A token belonging to an org
      # admin is covered by the OrganizationAdmin bypass and pushes fine.
      #
      # Optional on purpose: callers that have not been given the secret yet
      # fall back to GITHUB_TOKEN below and keep working exactly as before.
      PLUGIN_RELEASE_TOKEN:
        required: false

jobs:
  # Every plugin's build.yml fires this on any push to main with no path filter,
  # and a release means: bump the version, delete and recreate the GitHub
  # release, and publish to the Plugin Store. So a README typo used to offer
  # every BOSS user a plugin update that changed nothing they can run.
  #
  # Fails toward releasing. If the previous commit cannot be resolved (a new
  # branch, a force-push) or the event is not a push, this releases: a redundant
  # release is cheap, a silently skipped one is not.
  detect:
    name: Decide whether this push needs a release
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to diff against the pushed-from commit.
          fetch-depth: 0

      - name: Check whether the push is docs-only
        id: check
        run: |
          set -euo pipefail

          release() { echo "docs_only=false" >> "$GITHUB_OUTPUT"; }

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "Event is ${{ github.event_name }}, not a push - releasing."
            release; exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::notice::Cannot resolve the previous commit; releasing rather than guessing."
            release; exit 0
          fi

          # git diff --name-only is already one path per line. Keep it quoted:
          # relying on word-splitting would break on a path containing a space,
          # and it silently collapses to a single line in shells that do not
          # split (which is how a test of this predicate first misled me).
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'

          if [[ -z "$CHANGED" ]]; then
            echo "::notice::No file changes detected; releasing."
            release; exit 0
          fi

          # Deliberately conservative: only these count as prose. Anything else,
          # including build files, resources and source, is a real change.
          # The LICENSE/NOTICE alternatives are spelled out rather than using
          # `(^|/)`, whose behaviour differs between grep implementations.
          NON_DOCS=$(printf '%s\n' "$CHANGED" \
            | grep -vE '\.(md|txt)$|^docs/|^(LICENSE|NOTICE)$|/(LICENSE|NOTICE)$' || true)

          if [[ -z "$NON_DOCS" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only push - skipping the release. Use workflow_dispatch to force one."
          else
            echo "Non-docs changes present:"
            printf '%s\n' "$NON_DOCS" | sed 's/^/  /'
            release
          fi

  release:
    needs: detect
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Falls back to GITHUB_TOKEN so a caller that has not been handed
          # PLUGIN_RELEASE_TOKEN yet behaves exactly as it did before. Only
          # repos whose main is ruleset-protected actually need the override.
          token: ${{ secrets.PLUGIN_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bump version
        if: inputs.version_increment != 'none'
        run: |
          CURRENT=$(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.version_increment }}" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping version: $CURRENT -> $NEW_VERSION"
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" build.gradle.kts

          git config user.name "Risa Labs"
          git config user.email "enterprise@risalabs.ai"
          git add build.gradle.kts
          git commit -m "🔖 Bump version to ${NEW_VERSION} [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download boss-plugin-api
        if: inputs.boss_plugin_api_version != 'none' && inputs.boss_plugin_api_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/downloaded-deps
          API_VERSION="${{ inputs.boss_plugin_api_version }}"
          if [ "$API_VERSION" = "latest" ]; then
            # Auto-resolve latest release version
            API_VERSION=$(gh api repos/risa-labs-inc/boss-plugin-api/releases/latest --jq '.tag_name' | sed 's/^v//')
            echo "Resolved latest boss-plugin-api version: $API_VERSION"
          fi
          curl -sL -o build/downloaded-deps/boss-plugin-api.jar \
            "https://github.com/risa-labs-inc/boss-plugin-api/releases/download/v${API_VERSION}/boss-plugin-api-${API_VERSION}.jar"
          echo "Downloaded boss-plugin-api v${API_VERSION}"
          ls -la build/downloaded-deps/

      - name: Build plugin
        run: ./gradlew build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version" build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing release
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to BOSS Plugin Store
        run: |
          echo "Publishing to BOSS Plugin Store..."
          # /github buffers the JAR server-side and rejects assets over 50 MB.
          # Larger JARs go to /github/metadata, whose contract requires the
          # publisher to supply the JAR's SHA-256 (the server never downloads
          # the JAR on that path; clients verify downloads against this hash).
          # The largest jar in build/libs is the one uploaded to the release,
          # so hashing it here hashes the exact released bytes.
          JAR_FILE=$(ls -S build/libs/*.jar | head -n1)
          JAR_SIZE=$(stat -c%s "$JAR_FILE")
          ENDPOINT="github"
          BODY="{\"githubUrl\": \"${{ github.server_url }}/${{ github.repository }}\"}"
          if [ "$JAR_SIZE" -gt 52428800 ]; then
            ENDPOINT="github/metadata"
            SHA256=$(sha256sum "$JAR_FILE" | cut -d' ' -f1)
            BODY="{\"githubUrl\": \"${{ github.server_url }}/${{ github.repository }}\", \"sha256\": \"$SHA256\"}"
          fi
          echo "JAR: $JAR_FILE (${JAR_SIZE} bytes) -> POST /${ENDPOINT}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.risaboss.com/functions/v1/plugin-store/${ENDPOINT}" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}" \
            -d "$BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to publish to BOSS Store (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Successfully published to BOSS Plugin Store"
